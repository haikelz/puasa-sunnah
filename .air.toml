root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/api ./cmd/api"
entrypoint = ["./tmp/air/api"]
include_ext = ["go"]
exclude_dir = ["bin", "node_modules", "tmp", "vendor", ".wrangler"]
exclude_regex = ["_test.go"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
