basePath: /
definitions:
  app.HealthResponse:
    properties:
      service:
        example: puasa-sunnah-api
        type: string
      status:
        example: ok
        type: string
    type: object
  fasting.CalendarSource:
    properties:
      caveat:
        type: string
      coverage_end:
        type: string
      coverage_start:
        type: string
      id:
        type: string
      name:
        type: string
      publisher:
        type: string
      status:
        type: string
      url:
        type: string
    type: object
  fasting.Classification:
    properties:
      date:
        type: string
      disclaimer:
        type: string
      hijri:
        $ref: '#/definitions/fasting.HijriDate'
      notes:
        items:
          type: string
        type: array
      recommendations:
        items:
          $ref: '#/definitions/fasting.Occurrence'
        type: array
      restrictions:
        items:
          $ref: '#/definitions/fasting.Occurrence'
        type: array
      verdict:
        $ref: '#/definitions/fasting.Verdict'
      weekday:
        type: string
    type: object
  fasting.ClassificationRequest:
    properties:
      date:
        example: "2026-06-25"
        format: date
        type: string
      hijri:
        $ref: '#/definitions/fasting.HijriDate'
      is_pilgrim_at_arafah:
        type: boolean
    required:
    - date
    - hijri
    type: object
  fasting.HijriDate:
    properties:
      day:
        example: 10
        maximum: 30
        minimum: 1
        type: integer
      month:
        example: 1
        maximum: 12
        minimum: 1
        type: integer
      year:
        example: 1448
        type: integer
    required:
    - day
    - month
    - year
    type: object
  fasting.Occurrence:
    properties:
      evidence:
        type: string
      key:
        type: string
      name:
        type: string
    type: object
  fasting.Rule:
    properties:
      calculation:
        type: string
      caveat:
        type: string
      evidence:
        items:
          type: string
        type: array
      key:
        type: string
      kind:
        type: string
      name:
        type: string
    type: object
  fasting.Schedule:
    properties:
      anchor_date:
        type: string
      audience:
        type: string
      calendar_source:
        $ref: '#/definitions/fasting.CalendarSource'
      dates:
        items:
          $ref: '#/definitions/fasting.ScheduleDate'
        type: array
      disclaimer:
        type: string
      end_date:
        type: string
      period:
        $ref: '#/definitions/fasting.SchedulePeriod'
      start_date:
        type: string
      timezone:
        type: string
      total:
        type: integer
      week_starts_on:
        type: string
    type: object
  fasting.ScheduleDate:
    properties:
      date:
        type: string
      hijri:
        $ref: '#/definitions/fasting.HijriDate'
      notes:
        items:
          type: string
        type: array
      recommendations:
        items:
          $ref: '#/definitions/fasting.Occurrence'
        type: array
      weekday:
        type: string
    type: object
  fasting.SchedulePeriod:
    enum:
    - week
    - month
    - year
    type: string
    x-enum-varnames:
    - SchedulePeriodWeek
    - SchedulePeriodMonth
    - SchedulePeriodYear
  fasting.Verdict:
    enum:
    - optional
    - recommended
    - obligatory_period
    - prohibited
    type: string
    x-enum-varnames:
    - VerdictOptional
    - VerdictRecommended
    - VerdictObligatoryPeriod
    - VerdictProhibited
  http.ClassificationResponse:
    properties:
      data:
        $ref: '#/definitions/fasting.Classification'
    type: object
  http.ErrorDetail:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: invalid request
        type: string
    type: object
  http.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/http.ErrorDetail'
    type: object
  http.RulesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/fasting.Rule'
        type: array
    type: object
  http.ScheduleResponse:
    properties:
      data:
        $ref: '#/definitions/fasting.Schedule'
    type: object
info:
  contact: {}
  description: |-
    Production API for classifying and scheduling voluntary Islamic fasting days using the published Kementerian Agama RI 2026 Hijri calendar.
    Calendar output is planning information, not a fatwa. Ramadan, Shawwal, and Dhu al-Hijjah dates may be superseded by an official Sidang Isbat decision.
  title: Puasa Sunnah API
  version: "1.0"
paths:
  /api/{language}/fasting/classify:
    post:
      consumes:
      - application/json
      description: Classifies one Gregorian date using a caller-supplied, locally
        accepted Hijri date. Restrictions take precedence over voluntary recommendations.
      parameters:
      - description: Response language
        enum:
        - en
        - id
        in: path
        name: language
        required: true
        type: string
      - description: Gregorian and accepted Hijri date
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/fasting.ClassificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ClassificationResponse'
        "400":
          description: Invalid JSON or date
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Classify a fasting date
      tags:
      - Fasting
  /api/{language}/fasting/rules:
    get:
      description: Returns recommended patterns, prohibited days, evidence links,
        calculations, and jurisprudential caveats.
      parameters:
      - description: Response language
        enum:
        - en
        - id
        in: path
        name: language
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RulesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List supported fasting rules
      tags:
      - Fasting
  /api/{language}/fasting/schedules:
    get:
      description: Returns recommended voluntary fasting opportunities for the Gregorian
        week, month, or year containing the anchor date. Dates use the published Kementerian
        Agama RI 2026 calendar and Asia/Jakarta timezone.
      parameters:
      - description: Response language
        enum:
        - en
        - id
        in: path
        name: language
        required: true
        type: string
      - description: Schedule period
        enum:
        - week
        - month
        - year
        in: query
        name: period
        required: true
        type: string
      - description: Anchor date in YYYY-MM-DD; defaults to today in Asia/Jakarta
        example: "2026-08-09"
        in: query
        name: date
        type: string
      - default: false
        description: Apply the pilgrim-at-Arafah exception
        in: query
        name: is_pilgrim_at_arafah
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ScheduleResponse'
        "400":
          description: Invalid query
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: Calendar does not cover the requested range
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get a fasting schedule
      tags:
      - Fasting
  /health:
    get:
      description: Returns the API process health and service name.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.HealthResponse'
      summary: Check service health
      tags:
      - Health
schemes:
- http
- https
swagger: "2.0"
