services:
  puasa-sunnah:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${PORT:-8080}:8080
    env_file:
      - .env
    environment:
      # PORT in .env picks the host port; the container always listens on 8080.
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - shared-network

networks:
  shared-network:
    external: true
