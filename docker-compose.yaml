services:
  puasa-sunnah:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${PORT:-8080}:8080
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - shared-network

networks:
  shared-network:
    external: true
